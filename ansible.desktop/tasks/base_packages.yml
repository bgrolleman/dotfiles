---
- name: Install base packages
  become: true
  apt:
    name:
      - ansible
      - vim
      - git
      - tmux
      - kitty
      - zoxide

- name: Install i3 packages
  become: true
  apt:
    name:
      - i3
      - polybar
      - keychain
      - rofi
      - nitrogen
      - playerctl
      - blueman
      - pavucontrol
      - picom

- name: Development Environment
  become: true
  apt:
    name:
      - build-essential
      - ninja-build
      - luarocks

- name: Capture Tools
  become: true
  apt:
    name:
      - peek
      - obs-studio
      - grim
      - satty
      - slurp

- name: Brave Browser
  become: true
  ansible.builtin.shell: 'curl -fsS https://dl.brave.com/install.sh | sh'
  args:
    creates: /usr/bin/brave-browser

- name: Streamdeck
  community.general.flatpak:
    name: com.core447.StreamController
    state: present
    method: user
