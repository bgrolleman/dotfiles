run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux


# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g renumber-windows on

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "slanted"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status line on top (tmux only supports top/bottom, no vertical sidebar)
set-option -g status-position top
set -g status-right-length 100
set -g status-left-length 100

set -g status-left "#[fg=#{@thm_teal},bg=#{@thm_crust}]#[fg=#{@thm_crust},bg=#{@thm_teal}] #(hostname -s) "
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Per-window agent indicator: 🤖 = busy, ⏸ = waiting for input
set -g @catppuccin_window_text " #W#(~/.local/bin/tmux-window-agent-status '#{session_name}' '#I')"
set -g @catppuccin_window_current_text " #W#(~/.local/bin/tmux-window-agent-status '#{session_name}' '#I')"

# Refresh status regularly so agent indicators stay current
set -g status-interval 2

# Vertical window switcher ("sidebar"): prefix+Tab opens a popup listing all
# windows top-to-bottom with agent status; Enter jumps to the selected window
bind-key Tab choose-tree -Zw -F "#{?window_format,#W#(~/.local/bin/tmux-window-agent-status '#{session_name}' '#{window_index}'),}"
